name: Architecture Village CI

on:
  pull_request:
    paths:
      - 'apps/architecture-village/**'
      - '.github/workflows/architecture-village-ci.yml'

concurrency:
  group: architecture-village-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/architecture-village

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/architecture-village/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
