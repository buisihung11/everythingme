<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s10 (diagram). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s10" data-start="0" data-duration="10" data-width="1920" data-height="1080"
     data-transition-in="fade" data-transition-out="fade" data-transition-duration="0.4"
     style="--w: 1920px; --h: 1080px">
  <div class="os-frame clip" data-start="0" data-duration="10" data-track-index="0">
    <style>
      .eyebrow { font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); letter-spacing: 0.16em; text-transform: uppercase; }
      .os-diagram { height: calc(600 * var(--u)); }
      .os-diagram text { font-size: 30px; }
      .os-diagram .mono { font-family: var(--font-mono); }
      .os-diagram .small { font-size: 24px; fill: var(--c-muted); }
      .os-diagram .lbl-p { fill: var(--c-primary); }
      .os-diagram .lbl-s { fill: var(--c-secondary); }
      .os-diagram .lbl-a { fill: var(--c-accent); }
      .os-diagram .box-p { fill: none; stroke: var(--c-primary); stroke-width: 4; }
      .os-diagram .box-s { fill: none; stroke: var(--c-secondary); stroke-width: 4; }
      .os-diagram .slot { fill: none; stroke: var(--c-accent); stroke-width: 4; stroke-dasharray: 14 10; }
      .os-diagram .fill-a { fill: var(--c-accent); }
    </style>
    <div class="eyebrow">Composition across layers</div>
    <h2 class="os-h2" data-line="s10-1" data-enter="words" data-at="0.4">Compose in a <span class="os-accent">higher layer</span></h2>
    <div class="os-diagram">
      <svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
        <g class="ws">
          <rect class="box-p" x="20" y="20" width="1040" height="540" rx="28" />
          <text class="mono lbl-p" x="60" y="80">TaskWorkspace</text>
          <text class="small" x="320" y="80">widget</text>
        </g>
        <g class="card">
          <rect class="stroke" x="80" y="120" width="920" height="400" rx="24" />
          <text class="mono" x="120" y="180">TaskCard</text>
          <text class="small" x="290" y="180">entity</text>
          <text x="120" y="250">Learn Vue reactivity</text>
          <text class="small" x="120" y="295">due Friday · open</text>
          <rect class="slot" x="120" y="340" width="840" height="140" rx="18" />
          <text class="mono small" x="150" y="330">#actions</text>
        </g>
        <g class="btn">
          <rect class="box-s" x="160" y="365" width="560" height="90" rx="18" />
          <text class="mono lbl-s" x="440" y="422" text-anchor="middle">CompleteTaskButton</text>
          <text class="small" x="750" y="422">feature</text>
        </g>
        <g class="bad">
          <text class="mono" x="1140" y="250">TaskCard</text>
          <path class="stroke-accent no-edge" d="M1150 290 V 410" />
          <path class="stroke-accent no-edge" d="M1134 392 L1150 412 L1166 392" />
          <text class="mono" x="1140" y="470">complete-task</text>
          <path class="stroke-accent x" d="M1110 320 L1190 380" />
          <path class="stroke-accent x" d="M1190 320 L1110 380" />
          <text class="lbl-a" x="1220" y="360">no import</text>
        </g>
      </svg>
    </div>
  </div>
</div>
<script type="application/json" id="os-lines">{"s10-1":{"start":0.3,"end":3.285,"kind":"opinion","label":"OPINION"},"s10-2":{"start":3.535,"end":6.155,"kind":"opinion","label":"OPINION"}}</script>
<script>
  const S = OS.scene("s10");
  S.enter(".eyebrow", { at: 0.1, kind: "fade" });
  S.lines();
  const t1 = S.line("s10-1", 0.4);
  const t2 = S.line("s10-2", 4.6);
  S.enter(".ws", { at: t1 + 0.3, kind: "fade" });
  S.enter(".card", { at: t1 + 0.8, kind: "up" });
  S.draw(".slot", { at: t1 + 1.4, dur: 0.6 });
  S.enter(".btn", { at: t1 + 2.2, kind: "down" });
  S.enter(".bad", { at: t2 + 0.1, kind: "fade" });
  S.draw(".no-edge", { at: t2 + 0.2, dur: 0.5, stagger: 0.1 });
  S.draw(".x", { at: t2 + 1.4, dur: 0.3, stagger: 0.15 });
  S.done();
</script>
</body>
</html>
