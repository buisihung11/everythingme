<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s14 (text). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s14" data-start="0" data-duration="10" data-width="1920" data-height="1080"
     data-transition-in="fade" data-transition-out="fade" data-transition-duration="0.4"
     style="--w: 1920px; --h: 1080px">
  <div class="os-frame clip" data-start="0" data-duration="10" data-track-index="0">
    <style>
      .eyebrow { font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); letter-spacing: 0.16em; text-transform: uppercase; }
      .wrap { display: flex; gap: calc(80 * var(--u)); align-items: center; }
      .list { flex: 1 1 0; display: flex; flex-direction: column; gap: calc(18 * var(--u)); }
      .item { display: flex; align-items: center; gap: calc(22 * var(--u)); font-size: calc(42 * var(--u)); }
      .box { width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: calc(10 * var(--u)); border: calc(3 * var(--u)) solid var(--c-muted); display: flex; align-items: center; justify-content: center; font-size: calc(30 * var(--u)); color: var(--c-bg); position: relative; }
      .box .tick { position: absolute; inset: calc(-3 * var(--u)); border-radius: calc(10 * var(--u)); background: var(--c-secondary); display: flex; align-items: center; justify-content: center; transform: scale(0); }
      .blog { flex: 0 0 calc(720 * var(--u)); }
      .blog .k { font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); letter-spacing: 0.12em; text-transform: uppercase; }
      .blog .t { font-family: var(--font-heading); font-weight: var(--fw-heading); font-size: calc(58 * var(--u)); line-height: 1.1; margin-top: calc(14 * var(--u)); }
      .blog .d { margin-top: calc(18 * var(--u)); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); }
    </style>
    <div class="eyebrow">Your study plan</div>
    <h2 class="os-h2" data-line="s14-1" data-enter="words" data-at="0.4">Build a small <span class="os-accent">task app</span></h2>
    <div class="wrap">
      <div class="list">
        <div class="item"><span class="box"><span class="tick">✓</span></span>Reactivity: ref, computed, watch</div>
        <div class="item"><span class="box"><span class="tick">✓</span></span>Component contracts &amp; slots</div>
        <div class="item"><span class="box"><span class="tick">✓</span></span>Routing with Vue Router</div>
        <div class="item"><span class="box"><span class="tick">✓</span></span>Tests with Vitest</div>
        <div class="item"><span class="box"><span class="tick">✓</span></span>Performance profiling</div>
      </div>
      <div class="os-card blog" data-line="s14-2" data-at="5.0">
        <div class="k">Read next on the blog</div>
        <div class="t">Vue 3 for Senior <span class="os-secondary">React</span> Developers</div>
        <div class="d">Code for every pattern in this video</div>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="os-lines">{"s14-1":{"start":0.3,"end":4.123},"s14-2":{"start":4.373,"end":6.399}}</script>
<script>
  const S = OS.scene("s14");
  S.enter(".eyebrow", { at: 0.1, kind: "fade" });
  S.lines();
  const t1 = S.line("s14-1", 0.4);
  S.enter(".item", { at: t1 + 0.6, kind: "left", stagger: 0.35 });
  S.tl.to(".tick", { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.35 }, t1 + 1.2);
  S.done();
</script>
</body>
</html>
