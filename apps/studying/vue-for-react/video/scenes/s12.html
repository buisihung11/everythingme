<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s12 (diagram). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s12" data-start="0" data-duration="7.5" data-width="1920" data-height="1080"
     data-transition-in="fade" data-transition-out="fade" data-transition-duration="0.4"
     style="--w: 1920px; --h: 1080px">
  <div class="os-frame clip" data-start="0" data-duration="7.5" data-track-index="0">
    <style>
      .eyebrow { font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); letter-spacing: 0.16em; text-transform: uppercase; }
      .os-diagram { height: calc(600 * var(--u)); }
      .os-diagram text { font-size: 30px; font-family: var(--font-mono); }
      .os-diagram .small { font-size: 24px; fill: var(--c-muted); font-family: var(--font-body); }
      .os-diagram .lbl-s { fill: var(--c-secondary); }
      .os-diagram .lbl-a { fill: var(--c-accent); }
      .os-diagram .ok { fill: none; stroke: var(--c-secondary); stroke-width: 5; stroke-linecap: round; }
    </style>
    <div class="eyebrow">Import rules</div>
    <h2 class="os-h2" data-line="s12-1" data-enter="words" data-at="0.4">Dependencies point <span class="os-secondary">down</span></h2>
    <div class="os-diagram">
      <svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
        <g class="page">
          <rect class="stroke-primary" x="560" y="10" width="480" height="100" rx="20" />
          <text x="800" y="72" text-anchor="middle">pages/tasks</text>
        </g>
        <g class="feats">
          <rect class="stroke" x="160" y="230" width="500" height="100" rx="20" />
          <text x="410" y="292" text-anchor="middle">features/complete-task</text>
          <rect class="stroke" x="940" y="230" width="500" height="100" rx="20" />
          <text x="1190" y="292" text-anchor="middle">features/delete-task</text>
          <rect class="stroke" x="560" y="470" width="480" height="100" rx="20" />
          <text x="800" y="532" text-anchor="middle">entities/task</text>
        </g>
        <path class="ok down" d="M410 335 C 410 420, 640 420, 700 465" />
        <path class="ok down" d="M1190 335 C 1190 420, 960 420, 900 465" />
        <text class="lbl-s down-l" x="250" y="430">✓ lower layer</text>
        <path class="stroke-accent side" d="M665 280 H 935" />
        <path class="stroke-accent side-x" d="M770 250 L830 310" />
        <path class="stroke-accent side-x" d="M830 250 L770 310" />
        <text class="lbl-a side-l" x="800" y="225" text-anchor="middle">✕ sibling</text>
        <path class="stroke-primary coord" d="M640 115 C 560 160, 450 170, 420 225" />
        <path class="stroke-primary coord" d="M960 115 C 1040 160, 1150 170, 1180 225" />
        <text class="small coord-l" x="1140" y="160">page coordinates both</text>
      </svg>
    </div>
  </div>
</div>
<script type="application/json" id="os-lines">{"s12-1":{"start":0.3,"end":3.017},"s12-2":{"start":3.267,"end":5.77}}</script>
<script>
  const S = OS.scene("s12");
  S.enter(".eyebrow", { at: 0.1, kind: "fade" });
  S.lines();
  const t1 = S.line("s12-1", 0.4);
  const t2 = S.line("s12-2", 3.3);
  S.enter(".feats", { at: t1 + 0.2, kind: "fade" });
  S.draw(".down", { at: t1 + 0.7, dur: 0.6, stagger: 0.15 });
  S.enter(".down-l", { at: t1 + 1.1, kind: "fade" });
  S.draw(".side", { at: t1 + 1.6, dur: 0.4 });
  S.draw(".side-x", { at: t1 + 2.0, dur: 0.25, stagger: 0.1 });
  S.enter(".side-l", { at: t1 + 2.1, kind: "fade" });
  S.enter(".page", { at: t2 + 0.1, kind: "down" });
  S.draw(".coord", { at: t2 + 0.5, dur: 0.6, stagger: 0.15 });
  S.enter(".coord-l", { at: t2 + 1.0, kind: "fade" });
  S.done();
</script>
</body>
</html>
