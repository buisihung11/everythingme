<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s01 (text). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s01" data-start="0" data-duration="7.5" data-width="1920" data-height="1080"
     data-transition-in="fade" data-transition-out="fade" data-transition-duration="0.4"
     style="--w: 1920px; --h: 1080px">
  <div class="os-frame os-center clip" data-start="0" data-duration="7.5" data-track-index="0">
    <style>
      .eyebrow { font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); letter-spacing: 0.16em; text-transform: uppercase; }
      .duo { width: 100%; max-width: calc(1400 * var(--u)); margin-top: calc(24 * var(--u)); }
      .duo .os-card { text-align: left; }
      .tag { display: inline-block; font-family: var(--font-mono); font-size: calc(var(--fs-small) * var(--u)); padding: calc(6 * var(--u)) calc(18 * var(--u)); border-radius: calc(999 * var(--u)); border: calc(2 * var(--u)) solid currentColor; margin-bottom: calc(20 * var(--u)); }
      .stack { display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
      .bar { height: calc(22 * var(--u)); border-radius: calc(8 * var(--u)); background: color-mix(in srgb, var(--c-fg) 18%, transparent); }
      .bar.w1 { width: 92%; } .bar.w2 { width: 70%; } .bar.w3 { width: 84%; } .bar.w4 { width: 56%; }
      .dep { display: flex; align-items: center; gap: calc(18 * var(--u)); font-family: var(--font-mono); font-size: calc(30 * var(--u)); }
      .dep .wire { flex: 1 1 auto; height: calc(4 * var(--u)); background: var(--c-secondary); transform-origin: 0 50%; }
      .dep .node { padding: calc(8 * var(--u)) calc(16 * var(--u)); border-radius: calc(12 * var(--u)); border: calc(2 * var(--u)) solid var(--c-secondary); color: var(--c-secondary); }
      .caption-mini { margin-top: calc(18 * var(--u)); font-size: calc(var(--fs-small) * var(--u)); color: var(--c-muted); }
    </style>
    <div class="eyebrow">Vue 3 for senior React developers</div>
    <h1 class="os-h1" data-line="s01-1" data-enter="words" data-at="0.3">You already know <span class="os-primary">React</span>.</h1>
    <h2 class="os-h2 os-muted" data-line="s01-2" data-enter="words" data-at="1.8">The shift: how <span class="os-accent">state changes propagate</span></h2>
    <div class="os-row duo">
      <div class="os-card r-card">
        <div class="tag os-primary">React</div>
        <div class="stack">
          <div class="bar w1"></div><div class="bar w2"></div><div class="bar w3"></div><div class="bar w4"></div>
        </div>
        <div class="caption-mini">Whole component re-runs</div>
      </div>
      <div class="os-card v-card">
        <div class="tag os-secondary">Vue</div>
        <div class="dep"><span class="node">count</span><span class="wire"></span><span class="node">{{ count }}</span></div>
        <div class="caption-mini">Only the dependent update runs</div>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="os-lines">{"s01-1":{"start":0.3,"end":1.688},"s01-2":{"start":1.938,"end":4.428}}</script>
<script>
  const S = OS.scene("s01");
  S.enter(".eyebrow", { at: 0.1, kind: "fade" });
  S.lines();
  const t2 = S.line("s01-2", 1.8);
  S.enter(".r-card", { at: t2 + 0.6, kind: "up" });
  S.enter(".v-card", { at: t2 + 0.9, kind: "up" });
  S.tl.fromTo(".r-card .bar", { opacity: 0.25 }, { opacity: 1, duration: 0.25, stagger: 0.08, repeat: 3, yoyo: true, ease: "none" }, t2 + 1.2);
  S.tl.fromTo(".v-card .wire", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, t2 + 1.4);
  S.done();
</script>
</body>
</html>
